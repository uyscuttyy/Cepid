[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200

# Base Sepolia by default; never point this at mainnet casually.
[rpc_endpoints]
base-sepolia = "${CEPID_RPC_URL_BASE_SEPOLIA}"

[etherscan]
base-sepolia = { key = "${BASESCAN_API_KEY}", url = "https://api.basescan.org/api" }
